name: Periderm Security & Quality Scan
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, release/**]
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 2 AM
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  checks: write

env:
  PERIDERM_API_KEY: ${{ secrets.PERIDERM_API_KEY }}

jobs:
  periderm-scan:
    name: Periderm Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate scanning

      - name: Install Periderm CLI
        run: npm i -g periderm-cli@latest

      - name: Authenticate with Periderm
        if: env.PERIDERM_API_KEY != ''
        run: periderm auth login --token $PERIDERM_API_KEY

      - name: Install periderm-ci skill
        run: npx dev-marketplace add periderm-ci

      - name: Run Periderm scan
        id: scan
        run: |
          node .agents/skills/periderm-ci/scripts/periderm-ci.js scan \
            --format=json \
            --fail-on=critical,high \
            --min-launch=0 \
            --min-reality=0

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: periderm-results.sarif
          category: periderm

  periderm-review:
    name: Periderm AI Review (Deep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Periderm CLI
        run: npm i -g periderm-cli@latest

      - name: Authenticate with Periderm
        if: env.PERIDERM_API_KEY != ''
        run: periderm auth login --token $PERIDERM_API_KEY

      - name: Run Periderm deep review
        run: |
          node .agents/skills/periderm-ci/scripts/periderm-ci.js review --deep

  periderm-ready:
    name: Launch Readiness Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Periderm CLI
        run: npm i -g periderm-cli@latest

      - name: Authenticate with Periderm
        if: env.PERIDERM_API_KEY != ''
        run: periderm auth login --token $PERIDERM_API_KEY

      - name: Check launch readiness
        run: |
          node .agents/skills/periderm-ci/scripts/periderm-ci.js ready \
            --min-launch=60 \
            --min-reality=50 \
            --min-perf=70