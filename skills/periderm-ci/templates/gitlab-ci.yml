# Periderm CI for GitLab
# Include this in your .gitlab-ci.yml or copy the jobs

stages:
  - security
  - quality
  - release

variables:
  PERIDERM_API_KEY: $PERIDERM_API_KEY  # Set in GitLab CI/CD variables

periderm_scan:
  stage: security
  image: node:20
  before_script:
    - npm i -g periderm-cli@latest
    - npx dev-marketplace add periderm-ci
  script:
    - |
      if [ -n "$PERIDERM_API_KEY" ]; then
        periderm auth login --token "$PERIDERM_API_KEY"
      fi
    - node .agents/skills/periderm-ci/scripts/periderm-ci.js scan --format=json --fail-on=critical,high
  artifacts:
    reports:
      sast: periderm-results.sarif
    when: always
    expire_in: 30 days
  allow_failure: false

periderm_review:
  stage: quality
  image: node:20
  before_script:
    - npm i -g periderm-cli@latest
  script:
    - |
      if [ -n "$PERIDERM_API_KEY" ]; then
        periderm auth login --token "$PERIDERM_API_KEY"
      fi
    - node .agents/skills/periderm-ci/scripts/periderm-ci.js review --deep
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual  # Run on demand for MRs
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

periderm_ready:
  stage: release
  image: node:20
  before_script:
    - npm i -g periderm-cli@latest
  script:
    - |
      if [ -n "$PERIDERM_API_KEY" ]; then
        periderm auth login --token "$PERIDERM_API_KEY"
      fi
    - node .agents/skills/periderm-ci/scripts/periderm-ci.js ready --min-launch=60 --min-reality=50 --min-perf=70
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      when: on_success